services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STORE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${STORE_DB_NAME:-credit_risk}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  db_api:
    build: ./db_api
    environment:
      DATABASE_URL: postgresql+psycopg2://${STORE_DB_USER:-postgres}:${STORE_DB_PASSWORD:-postgres}@db:5432/${STORE_DB_NAME:-credit_risk}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Deployment services. For local dev, run only `db` + `db_api` and use `npm run dev`.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DB_API_URL: http://db_api:8001
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8002:8002"
    depends_on:
      - db_api
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
      - db_api
    restart: unless-stopped

volumes:
  pgdata:
