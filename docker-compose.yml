services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STORE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${STORE_DB_NAME:-credit_risk}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    # Every other service restarts itself. Without this the database is the one
    # thing that stays down after the daemon kills it, and db_api then sits in
    # a restart loop that never resolves on its own.
    restart: unless-stopped

  db_api:
    build: ./db_api
    environment:
      DATABASE_URL: postgresql+psycopg2://${STORE_DB_USER:-postgres}:${STORE_DB_PASSWORD:-postgres}@db:5432/${STORE_DB_NAME:-credit_risk}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Deployment services. For local dev, run only `db` + `db_api` and use `npm run dev`.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DB_API_URL: http://db_api:8001
      CORS_ORIGINS: http://localhost:8080
      # The OCR service runs outside this compose file. "localhost" here would
      # mean this container, not your machine, so default to the host gateway.
      # Set BACKEND_URL in .env to point somewhere else.
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    # host.docker.internal exists by default on Docker Desktop but not on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    depends_on:
      - db_api
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
      - db_api
    restart: unless-stopped

volumes:
  pgdata:
