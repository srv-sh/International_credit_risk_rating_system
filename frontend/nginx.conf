# Mirrors the Vite dev proxy: /api -> compute API, /db -> storage API (prefix stripped).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8002/;
        proxy_read_timeout 900s;  # OCR/LLM calls are slow (matches BACKEND_TIMEOUT)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /db/ {
        proxy_pass http://db_api:8001/;
        proxy_set_header Host $host;
    }

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
